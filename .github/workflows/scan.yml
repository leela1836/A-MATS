name: A-MATS market scan

# Runs on GitHub's servers — independent of your laptop.
#  • 3 heavy SCREEN sweeps/day (pre / mid / post) find new trades, learn, publish.
#  • A light MANAGE loop every 10 min during the session re-prices OPEN trades and
#    exits any that hit a level, broke their thesis, or expired — the "near-live"
#    position management. Each run also restores, marks and saves the paper account.
#
# GitHub cron is UTC. NSE trades ~09:15-15:30 IST (UTC+5:30):
#   03:15 UTC = 08:45 IST → pre-open · 06:00 → mid · 10:15 → post-close
# Public repo ⇒ unlimited free Actions minutes. Scheduled runs can be delayed a few
# minutes under load; holidays journal "market closed" (the calendar guard handles it).

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/scan.yml'
      - 'app/execution/cloud.py'
      - 'configs/**'
      - 'requirements-realtime.txt'
  schedule:
    - cron: "15 3 * * 1-5"      # 08:45 IST — pre-open plan (SCREEN)
    - cron: "0 6 * * 1-5"       # 11:30 IST — mid-session, orders fill (SCREEN)
    - cron: "15 10 * * 1-5"     # 15:45 IST — post-close resolution + LEARN (SCREEN)
    - cron: "*/10 3-10 * * 1-5" # every 10 min through the session — MANAGE open trades
  workflow_dispatch:             # manual "Run workflow" button (SCREEN)

permissions:
  contents: write                # to commit the updated journal back
  pages: write
  id-token: write

concurrency:
  group: amats-scan
  cancel-in-progress: false      # never interrupt a scan mid-write; queue instead

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
      revision: ${{ steps.publish.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-realtime.txt

      - name: Label the run (session + mode)
        run: |
          case "${{ github.event.schedule }}" in
            "15 3 * * 1-5")      echo "SCAN_SESSION=pre"    >> "$GITHUB_ENV"; echo "SCAN_MODE=screen"  >> "$GITHUB_ENV" ;;
            "0 6 * * 1-5")       echo "SCAN_SESSION=mid"    >> "$GITHUB_ENV"; echo "SCAN_MODE=screen"  >> "$GITHUB_ENV" ;;
            "15 10 * * 1-5")     echo "SCAN_SESSION=post"   >> "$GITHUB_ENV"; echo "SCAN_MODE=screen"  >> "$GITHUB_ENV" ;;
            "*/10 3-10 * * 1-5") echo "SCAN_SESSION=manage" >> "$GITHUB_ENV"; echo "SCAN_MODE=manage"  >> "$GITHUB_ENV" ;;
            *)                   echo "SCAN_SESSION=manual" >> "$GITHUB_ENV"; echo "SCAN_MODE=screen"  >> "$GITHUB_ENV" ;;
          esac

      - name: Restore and run the persistent paper account
        id: paper
        continue-on-error: true
        timeout-minutes: 5
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python -m app.execution.cloud --seconds 60

      - name: Persist the paper account before running research
        run: |
          python -c "from app.status.build_site import _paper_account; _paper_account()"
          git config user.name "amats-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/realtime_portfolio.json docs/paper.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(paper): persist scheduled account session [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push
          fi

      - name: Run (screen finds research ideas · manage resolves research ideas)
        id: research
        continue-on-error: true
        timeout-minutes: 10
        env:
          # Real market data from the cloud (Upstox Analytics Token as a repo secret).
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          # LLM-reason the strongest N picks per SCREEN. 0 = fully deterministic.
          # Live data shows LLM calls produce 54% win rate vs 43% deterministic —
          # raising this from 5 to 10 costs ~10 more API calls/day but meaningfully
          # shifts the trade mix toward higher-quality setups.
          SCAN_LLM_TOP: "10"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          OUT=$(python -m app.journal.scan)
          echo "$OUT"

      - name: Regenerate training data from the universe (weekly — Friday post)
        if: env.SCAN_SESSION == 'post'
        run: |
          if [ "$(date -u +%u)" = "5" ]; then
            echo "backtesting the universe into a fresh labeled dataset"
            python -m app.ml.generate || echo "generate skipped (data unavailable)"
          else
            echo "not the weekly regeneration slot; using the existing cache"
          fi

      - name: Learn from experience (daily — post-market)
        if: env.SCAN_SESSION == 'post'
        run: |
          echo "retraining validator on accumulated journal + bootstrap"
          python -m app.ml.learn || echo "learn skipped (not enough data yet)"

      - name: Update strategy roster (promote/demote on live results — post-market)
        if: env.SCAN_SESSION == 'post'
        run: python -m app.strategies.library.roster || echo "roster unchanged"

      - name: Build the status site (GitHub Pages)
        run: python -m app.status.build_site

      - name: Commit the journal, model, and site data
        id: publish
        run: |
          git config user.name "amats-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/journal.db data/benchmark.json app/ml/models/trade_validator.json docs/data.json docs/nn.json
          git add -f data/realtime_portfolio.json docs/paper.json
          [ -f data/bootstrap.npz ] && git add -f data/bootstrap.npz || true
          [ -f data/strategy_roster.json ] && git add -f data/strategy_roster.json || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(journal): ${SCAN_SESSION} scan $(date -u +%FT%TZ) [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push
          fi
          echo "publish=1" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Surface processing failures after saving and publishing account state
        if: steps.paper.outcome == 'failure' || steps.research.outcome == 'failure'
        run: exit 1

  pages:
    needs: scan
    if: always() && needs.scan.outputs.publish == '1'
    uses: ./.github/workflows/pages.yml
    with:
      revision: ${{ needs.scan.outputs.revision }}
