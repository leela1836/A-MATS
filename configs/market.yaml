# A-MATS Market Configuration
# Defines market data sources, symbols, timeframes, and data feed parameters

# ─── Market Data Sources (Indian market: NSE / BSE) ───
data_sources:
  yahoo_finance:
    # Free NSE/BSE coverage via .NS / .BO suffixes and Indian index tickers.
    enabled: true
    rate_limit_per_minute: 2000
    timeout_seconds: 30
    retry_attempts: 3
    retry_backoff_base: 2.0

  nse_python:
    # Direct NSE India data (nsepython / jugaad-data) for quotes, option chain,
    # and the official holiday calendar. No API key required.
    enabled: false
    rate_limit_per_minute: 60
    timeout_seconds: 30

  groww_api:
    # Groww API — historical + live quotes for account holders.
    enabled: false
    api_key_env: GROWW_API_KEY
    api_secret_env: GROWW_API_SECRET
    rate_limit_per_minute: 180
    timeout_seconds: 30

  websocket_feed:
    enabled: false
    provider: groww  # Options: groww, upstox, angel_one
    api_key_env: WS_API_KEY
    reconnect_delay_seconds: 5
    max_reconnect_attempts: 10

# ─── Tradable Symbols (NSE tickers; .NS suffix for Yahoo Finance) ───
symbols:
  equities:
    - RELIANCE.NS
    - TCS.NS
    - HDFCBANK.NS
    - INFY.NS
    - ICICIBANK.NS
    - SBIN.NS
    - BHARTIARTL.NS
    - ITC.NS
    - LT.NS
    - HINDUNILVR.NS

  indices:
    - ^NSEI       # Nifty 50
    - ^NSEBANK    # Bank Nifty
    - ^BSESN      # BSE Sensex
    - ^INDIAVIX   # India VIX

  crypto:
    # Indian exchanges quote INR pairs; Yahoo uses USD. Disabled for MVP.
    enabled: false
    pairs:
      - BTC-INR
      - ETH-INR

  forex:
    enabled: false
    pairs:
      - USDINR=X
      - EURINR=X
      - GBPINR=X

# ─── Timeframes ───
timeframes:
  intraday:
    - 1m
    - 5m
    - 15m
    - 1h
  daily:
    - 1d
  weekly:
    - 1wk
  default: 1d

# ─── Data Fetching ───
data_fetching:
  lookback_days: 365
  batch_size: 10  # Symbols per batch request
  cache_ttl_seconds: 60
  preload_on_startup: true
  preload_symbols:
    - ^NSEI
    - RELIANCE.NS
    - HDFCBANK.NS
    - ^INDIAVIX

# ─── Technical Indicators (TA-Lib) ───
indicators:
  trend:
    - sma
    - ema
    - macd
    - adx
  momentum:
    - rsi
    - stoch
    - cci
    - williams_r
  volatility:
    - bollinger_bands
    - atr
  volume:
    - obv
    - volume_profile
  custom:
    enabled: true
    max_lookback: 100

# ─── Market Hours (NSE/BSE, IST) ───
market_hours:
  regular:
    open: "09:15"
    close: "15:30"
    timezone: Asia/Kolkata
  pre_open:
    # NSE pre-open session (price discovery auction).
    enabled: false
    open: "09:00"
    close: "09:15"
  post_close:
    # NSE post-close session.
    enabled: false
    open: "15:40"
    close: "16:00"