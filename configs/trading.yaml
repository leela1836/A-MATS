# A-MATS Trading Configuration
# Defines trading modes, execution parameters, and strategy settings

# ─── Trading Mode ───
# Currency: INR. Balances and slippage are in rupees.
mode:
  current: paper  # Options: simulation, paper, live
  currency: INR
  simulation:
    initial_balance: 100000.0   # ₹10,00,000
    slippage_model: percentage   # Options: fixed, percentage, market_impact
    fixed_slippage: 0.05         # ₹0.05 per share
    percentage_slippage: 0.0005  # 0.05% (tight for liquid NSE large-caps)
    commission_per_trade: 20.0   # ~₹20 flat brokerage (Zerodha intraday cap)
    fill_rate: 0.95              # 95% of orders fill
    latency_ms: 50
  paper:
    # In-app paper trading: the agent trades a virtual INR portfolio owned and
    # rendered by our own web app. No external broker is contacted. The broker
    # field below only matters if live execution is later routed to a real
    # broker; paper stays fully in-app.
    initial_balance: 100000.0
    in_app: true
    broker: groww  # Options: groww, upstox, angel_one
    commission_per_trade: 20.0   # ~₹20 flat brokerage per order
    percentage_slippage: 0.0005  # 0.05% applied to the fill price
    api_key_env: PAPER_API_KEY
    api_secret_env: PAPER_API_SECRET
    base_url: https://api.groww.in
  live:
    enabled: false
    broker: groww
    api_key_env: LIVE_API_KEY
    api_secret_env: LIVE_API_SECRET
    base_url: https://api.groww.in
    require_confirmation: true

# ─── Execution ───
execution:
  order_types:
    default: limit  # Options: market, limit, stop
    allow_market_orders: true
    allow_limit_orders: true
    allow_stop_orders: true
  limit_order:
    offset_ticks: 2  # Place limit order 2 ticks from market
    max_wait_seconds: 300
    cancel_if_not_filled: true
  order_routing:
    preferred_broker: alpaca
    fallback_broker: null
  time_in_force:
    default: day  # Options: day, gtc, ioc, fok
    allow_gtc: true
    allow_ioc: true
    allow_fok: false

# ─── Strategy ───
strategy:
  default: multi_agent  # Options: multi_agent, trend_following, mean_reversion, breakout
  multi_agent:
    consensus_required: majority  # Options: unanimous, majority, weighted
    min_agreeing_agents: 3
    weight_by_historical_performance: true
  trend_following:
    enabled: true
    fast_period: 20
    slow_period: 50
    signal_threshold: 0.5
  mean_reversion:
    enabled: true
    lookback_period: 20
    entry_std_dev: 2.0
    exit_std_dev: 0.5
  breakout:
    enabled: true
    lookback_period: 20
    breakout_threshold_percent: 2.0
    volume_confirmation: true

# ─── Portfolio Management ───
portfolio:
  rebalance_frequency: weekly  # Options: daily, weekly, monthly
  rebalance_threshold_percent: 5.0
  profit_taking:
    enabled: true
    target_monthly_return_percent: 5.0
    excess_profit_reinvest_percent: 50.0
  loss_management:
    max_monthly_loss_percent: 8.0
    reduce_size_after_loss: true
    reduction_factor: 0.5
    recovery_trades_required: 3

# ─── Scheduling ───
scheduling:
  trading_hours_only: true
  pre_market_trading: false
  after_hours_trading: false
  analysis_frequency_minutes: 15
  market_open_analysis: true
  market_close_analysis: true
  weekend_trading: false

  # ACTUAL DATES the market-hours guard checks (app/market_calendar.py).
  # Only fixed-date holidays are seeded below. Most NSE holidays follow lunar
  # festivals whose dates MOVE every year and cannot be derived — Holi,
  # Diwali, Eid, Ram Navami, Dussehra, Guru Nanak Jayanti, Good Friday etc.
  # Copy those from the official NSE holiday circular each year and add them
  # here. A date that is missing is treated as a NORMAL TRADING DAY, so an
  # omission surfaces as an unexpected trade rather than silent skipping.
  # Weekends are handled automatically and need no entries.
  holiday_dates:
    # 2026 — fixed-date only, VERIFY against the NSE circular
    - 2026-01-26   # Republic Day
    - 2026-08-15   # Independence Day
    - 2026-10-02   # Mahatma Gandhi Jayanti
    - 2026-12-25   # Christmas
    # 2027 — fixed-date only
    - 2027-01-26   # Republic Day
    - 2027-08-15   # Independence Day
    - 2027-10-02   # Mahatma Gandhi Jayanti
    - 2027-12-25   # Christmas

  # Human-readable reference list (NOT used for date checks — see holiday_dates)
  holidays:
    - Republic_Day          # 26 Jan
    - Maha_Shivaratri
    - Holi
    - Id_ul_Fitr
    - Ram_Navami
    - Mahavir_Jayanti
    - Good_Friday
    - Dr_Ambedkar_Jayanti   # 14 Apr
    - Maharashtra_Day       # 01 May
    - Bakri_Id
    - Independence_Day      # 15 Aug
    - Ganesh_Chaturthi
    - Mahatma_Gandhi_Jayanti  # 02 Oct
    - Dussehra
    - Diwali_Laxmi_Pujan    # Muhurat trading (special session)
    - Diwali_Balipratipada
    - Guru_Nanak_Jayanti
    - Christmas             # 25 Dec

# ─── Notifications ───
notifications:
  enabled: true
  channels:
    - console
    - log
  events:
    - trade_opened
    - trade_closed
    - stop_loss_hit
    - take_profit_hit
    - drawdown_warning
    - system_error
    - daily_summary

# ─── Logging ───
logging:
  level: INFO  # Options: DEBUG, INFO, WARNING, ERROR
  trade_log: true
  performance_log: true
  error_log: true
  log_retention_days: 30